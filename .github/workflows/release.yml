name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@12.1.0
      - name: Fetch exact release tag
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          git fetch --force --no-tags origin "$tag_ref:$tag_ref"
      - name: Validate exact semantic annotated tag
        run: node scripts/validate-release-identity.mjs "$GITHUB_REF_NAME"
      - name: Install exact dependencies
        run: npm ci
      - name: Verify tagged state
        run: npm run check
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
