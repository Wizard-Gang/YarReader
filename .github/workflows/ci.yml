name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check committed whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            git diff --check "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA"
          else
            echo "::error::Unsupported CI event: $EVENT_NAME"
            exit 1
          fi

  change-id:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull-request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^\[YR-[0-9]{3,}\] \[(INIT|FEAT|FIX|SEC|API|A11Y|I18N|AI|DB|OPS|TEST|DOCS|REFACTOR|PERF|BUILD|REVERT|CHORE)\] .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::Title must match [YR-###] [TYPE] <imperative summary>"
            exit 1
          fi
